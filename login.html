<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Jong Deng to access your account and explore opportunities">
    <title>Login - Jong Deng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#216282',
                        secondary: '#f7a048',
                        neutral: '#f5f5f5'
                    },
                    boxShadow: {
                        '3xl': '0 35px 60px -15px rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-entrance {
            animation: fadeInScale 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-primary to-blue-900 min-h-screen flex items-center justify-center py-8 px-4">
    <div class="max-w-sm w-full animate-entrance"> <div class="text-center mb-6">
            <h1 class="text-4xl font-extrabold text-white mb-2 tracking-wide">Jong Deng</h1>
            <p class="text-neutral text-lg opacity-90">Welcome back! Access your opportunities.</p>
        </div>

        <div class="bg-white rounded-xl shadow-3xl p-6 sm:p-8 transform transition duration-500 hover:shadow-2xl">
            <h2 class="text-2xl font-bold text-primary mb-6 text-center border-b-2 border-secondary pb-2">Secure Login</h2>
            
            <form>
                <div class="mb-5">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email or Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <input type="text" id="email" name="email" class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:ring-4 focus:ring-secondary/50 focus:border-secondary transition duration-200 ease-in-out" placeholder="username@example.com" required>
                    </div>
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9V5a2 2 0 00-2-2 2 2 0 00-2 2v4m-4 5h8m-8 0v2a2 2 0 002 2h4a2 2 0 002-2v-2"></path></svg>
                        </div>
                        <input type="password" id="password" name="password" class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:ring-4 focus:ring-secondary/50 focus:border-secondary transition duration-200 ease-in-out" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-secondary focus:ring-secondary border-gray-300 rounded-sm cursor-pointer">
                        <label for="remember" class="ml-2 text-sm text-gray-700 select-none">Remember me</label>
                    </div>
                    <a href="#" class="text-sm text-secondary font-medium hover:text-primary transition duration-200 ease-in-out hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="w-full bg-secondary text-white py-3 rounded-lg font-bold text-lg tracking-wider hover:bg-orange-700 transition duration-300 ease-in-out transform hover:scale-[1.01] shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-secondary/50">
                    Sign In
                </button>

                <div class="relative my-7">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-400 font-light">OR</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button type="button" class="flex items-center justify-center px-4 py-2.5 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-neutral transition duration-200 ease-in-out transform hover:scale-[1.02] shadow-sm">
                        <svg class="w-5 h-5 mr-2 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        <span class="text-sm font-medium">Facebook</span>
                    </button>
                    <button type="button" class="flex items-center justify-center px-4 py-2.5 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-neutral transition duration-200 ease-in-out transform hover:scale-[1.02] shadow-sm">
                        <svg class="w-5 h-5 mr-2 text-red-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
                        </svg>
                        <span class="text-sm font-medium">Google</span>
                    </button>
                </div>

                <p class="text-center text-gray-600 text-sm">
                    New to Jong Deng? 
                    <a href="#" class="text-secondary font-bold hover:text-primary transition duration-200 hover:underline">Create an Account</a>
                </p>
            </form>
        </div>

        <div class="text-center mt-8">
            <a href="index.html" class="inline-flex items-center text-neutral text-sm hover:text-white transition duration-200 transform hover:scale-105">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Home
            </a>
        </div>
    </div>
</body>
</html>
